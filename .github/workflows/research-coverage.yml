name: Research coverage audit
on:
  workflow_dispatch:
  push:
    branches:
      - integration/research-coverage-audit
      - preview
    paths:
      - engine.js
      - movement-instruction.js
      - rolling-calendar.js
      - session-timer.js
      - programming-education.js
      - styles.css
      - interface-polish.css
      - learning.js
      - 'assets/**'
      - '*.svg'
      - '*.webp'
      - '*.png'
      - sw.js
      - index.html
      - manifest.webmanifest
      - 'tests/**'
      - notebook.js
      - app.js
      - .github/workflows/research-coverage.yml
  pull_request:
    paths:
      - engine.js
      - movement-instruction.js
      - rolling-calendar.js
      - session-timer.js
      - programming-education.js
      - styles.css
      - interface-polish.css
      - learning.js
      - 'assets/**'
      - '*.svg'
      - '*.webp'
      - '*.png'
      - sw.js
      - index.html
      - manifest.webmanifest
      - 'tests/**'
      - notebook.js
      - app.js
      - .github/workflows/research-coverage.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check engine.js
          node --check notebook.js
          node --check movement-instruction.js
          node --check rolling-calendar.js
          node --check session-timer.js
          node --check programming-education.js
          node --check learning.js
          node --check sw.js
          for file in tests/*.js; do node --check "$file"; done
          for file in tests/*.cjs; do [ -f "$file" ] && node --check "$file"; done
      - name: Ensure every Node regression suite is executed
        run: |
          python3 - <<'PY'
          import pathlib,re,sys
          workflow=pathlib.Path('.github/workflows/research-coverage.yml').read_text()
          # Read only the audit job's command section, not the browser job.
          audit=workflow.split(chr(10)+'  browser-smoke:',1)[0]
          referenced=set(re.findall(r'node (tests/[A-Za-z0-9_-]+\.js)',audit))
          suites={str(p) for p in pathlib.Path('tests').glob('*.js') if p.name not in {'browser-smoke.js','browser-demo-history.js'}}
          missing=sorted(suites-referenced)
          if missing:sys.exit('Unexecuted regression suites: '+', '.join(missing))
          print('Node regression suites covered:',len(suites))
          PY
      - name: Run additional history correction regression tests
        run: node --test tests/history-corrections.test.cjs
      - name: Generate and validate two-year engine demo backup
        run: node tests/generate-demo-backup.cjs strength-lab-engine-demo-backup.json
      - name: Cross-check generated demo backup and progression report
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const backup=JSON.parse(fs.readFileSync('strength-lab-engine-demo-backup.json','utf8'));
          const report=JSON.parse(fs.readFileSync('strength-lab-engine-demo-backup-progression-report.json','utf8'));
          assert.equal(report.sessions,backup.sessions.length);
          assert.ok(report.checkpoints.length>=10,'Missing progression checkpoints');
          assert.equal(report.checkpoints.at(-1).session,backup.sessions.length,'Missing final checkpoint');
          assert.equal(report.checkpoints.at(-1).date,backup.sessions.at(-1).date);
          assert.ok(report.swingEligibleTracks.heavy>0&&report.swingEligibleTracks.light>0);
          const ids=new Set(backup.sessions.flatMap(session=>session.items.map(item=>item.id)));
          for(const id of ids)assert.ok(report.checkpoints.at(-1).movements[id],'Missing final state for '+id);
          console.log('Demo backup and progression report cross-check passed');
          NODE
      - name: Upload two-year demo backup
        uses: actions/upload-artifact@v4
        with:
          name: strength-lab-engine-demo-backup
          path: |
            strength-lab-engine-demo-backup.json
            strength-lab-engine-demo-backup-progression-report.json
          retention-days: 14
      - name: Validate movement mappings and source integrity
        run: |
          node tests/movement-integration.js
          node tests/curriculum-integration.js
          node tests/research-coverage.js
          node tests/prerequisite-contract.js
          node tests/progression-history.js
          node tests/programming-profile-contract.js
          node tests/full-training-cycle.js
          node tests/year-history.js
          node tests/five-year-history.js
          node tests/decade-lifecycle-regression.js
          node tests/history-corrections.js
          node tests/backup-history.js
          node tests/offline-precache-integrity.js
          node tests/log-pagination.js
      - name: Validate workout recording, timer, and recovery regressions
        run: |
          node tests/draft-save-regression.js
          node tests/partial-workout-regression.js
          node tests/backup-integrity.js
          node tests/configuration-matrix.js
          node tests/engine-regression.js
          node tests/instruction-coverage-regression.js
          node tests/long-break-regression.js
          node tests/provenance-regression.js
          node tests/recovery-regression.js
          node tests/skill-gates-regression.js
          node tests/timer-clear-integrity.js
          node tests/timer-mutation-integrity.js
          node tests/timer-regression.js
          node tests/timer-tick-integrity.js
          node tests/year-simulation.js
          node tests/time-budget-feasibility.js
      # Browser smoke is a separate job. A transient Ubuntu apt outage must not
      # conceal whether the engine, research, and packaging checks passed.
      - name: Package isolated review build
        run: |
          mkdir -p review-build
          python3 - <<'PY'
          import pathlib, shutil
          root=pathlib.Path('.')
          # Only ship runtime assets, never repository docs or test scaffolding.
          import json, re
          sw=(root/'sw.js').read_text()
          match=re.search(r'const FILES=(\[[^;]+\]);',sw)
          if not match:
              raise SystemExit('Missing offline asset manifest')
          runtime={'index.html','sw.js'}
          runtime.update(p.removeprefix('./') for p in json.loads(match.group(1)) if p not in ('.','./'))
          for filename in sorted(runtime):
              source=root/filename
              if not source.is_file():
                  raise SystemExit('Missing runtime asset: '+filename)
              destination=pathlib.Path('review-build')/filename
              destination.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(source,destination)
          PY
      - name: Verify review package completeness
        run: |
          python3 - <<'PY'
          import pathlib,re,sys
          root=pathlib.Path('review-build')
          html=(root/'index.html').read_text()
          assets=re.findall(r'(?:src|href)="([^"]+)"',html)
          assets += re.findall(r'url\(([^)]+)\)',html)
          required=['index.html','app.js','engine.js','notebook.js','styles.css','sw.js','manifest.webmanifest']
          required += [x.strip("'\\\"").split('?')[0] for x in assets if not x.startswith(('http:','https:','#','data:'))]
          sw=(root/'sw.js').read_text()
          match=re.search(r'const FILES=(\[[^;]+\]);',sw)
          if not match:sys.exit('Review package has no static offline precache manifest')
          import json
          required += [x.removeprefix('./').split('?')[0] for x in json.loads(match.group(1)) if x not in ('.','./')]
          for css_name in ('styles.css','interface-polish.css'):
              css=(root/css_name).read_text()
              required += [x.strip("'\\\"").split('?')[0] for x in re.findall(r'url\(\s*([^)]*?)\s*\)',css) if not x.startswith(('data:','http:','https:','#'))]
          missing=sorted({x for x in required if not (root/x).is_file()})
          legacy=sorted(str(p) for p in (root/'legacy').rglob('*') if p.is_file()) if (root/'legacy').exists() else []
          if legacy:sys.exit('Retired legacy interface was included in review build: '+', '.join(legacy))
          if missing:sys.exit('Review package missing required assets: '+', '.join(missing))
          # Fail if the review artifact accidentally starts shipping repository-only files.
          forbidden=['README.md','SOURCE-COMMIT.txt','docs','research','tests','.github']
          leaked=[name for name in forbidden if (root/name).exists()]
          if leaked:sys.exit('Non-runtime files leaked into review package: '+', '.join(leaked))
          print('Review package asset references checked:',len(required),'missing:',len(missing))
          PY
      - name: Stamp review build identity
        env:
          REVIEW_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          path=pathlib.Path('review-build/preview-build.json')
          data=json.loads(path.read_text())
          data['channel']='research-integration-review'
          data['source_commit']=os.environ['REVIEW_SHA']
          data['production_modified']=False
          path.write_text(json.dumps(data,indent=2)+chr(10))
          print('Review package commit:',data['source_commit'])
          PY
      - name: Upload review build for download
        uses: actions/upload-artifact@v4
        with:
          name: strength-lab-integration-review
          path: review-build/
          retention-days: 14
          if-no-files-found: error
      # --strict is intentionally not enabled until known research gaps are resolved.

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Smoke test app in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/strength-lab-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/index.html; then break; fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/strength-lab-http.log
              echo 'Browser test server did not become ready' >&2
              exit 1
            fi
            sleep 1
          done
          node tests/browser-smoke.js
          node tests/browser-curriculum.cjs
          node tests/browser-integration.cjs
          node tests/generate-demo-backup.cjs strength-lab-engine-demo-backup.json
          node tests/browser-demo-history.js
      - name: Publish UI review handoff summary
        if: always()
        run: |
          {
            echo '## Strength Lab populated-history UI review'
            echo ''
            echo 'Synthetic data only. No personal training history was changed.'
            echo ''
            echo '- Test viewport sizes: 320, 390, 832 and 1280 px.'
            echo '- Review screenshots in the **strength-lab-populated-history-screenshots** artifact below.'
            echo '- Review the demo JSON and progression report in the **strength-lab-engine-demo-backup** artifact from the audit job.'
            echo '- Full-page, viewport and expanded progression screenshots are captured.'
            echo '- A green browser-smoke job is required before declaring the UI verified.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload populated history screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strength-lab-populated-history-screenshots
          path: demo-*.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload browser server diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strength-lab-browser-server-diagnostics
          path: /tmp/strength-lab-http.log
          retention-days: 7
          if-no-files-found: ignore
